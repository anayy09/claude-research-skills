# Provenance of the five bundled institution workbooks. build_catalog.py reads
# this file and writes `list_kind`, `coverage_note` and `fee_note` into every
# row those workbooks produce; the report quotes them. Edit it when a list is
# replaced, and say what the list is and when it was exported, because a title
# missing from an eligibility list is a statement about an agreement, not about
# the journal.
#
# `institution` and `agreement` record the sponsorship the user identified on
# 2026-09-19. No contract was supplied with that mapping, so every row built
# from these workbooks carries evidence_status=user_confirmed_mapping. The
# researched fee-route CSVs in sources/ carry their own provenance per row and
# are not described here.

IEEE:
  file: IEEE.xlsx
  kind: publisher title list
  scope: IEEE journals with open-access type and 2024 JCR/CiteScore metrics, stated accurate as of 1 January 2026; not itself scoped to an institution
  institution: Manipal University Jaipur (MUJ)
  agreement: MUJ sponsorship as reported by the user; current contract not independently verified
  exported: "2026-01-01"
  fee_note: "Conditional MUJ APC coverage; verify corresponding author, article type, current term, allocation and ancillary fees."

Springer Nature:
  file: Springer_Nature.xlsx
  kind: agreement eligibility list
  scope: journals eligible under a Springer Nature fully-open-access agreement, with discipline and imprint only and no citation metrics; a Springer title absent here may still fit, but is outside that agreement
  institution: Manipal University Jaipur (MUJ)
  agreement: MUJ sponsorship as reported by the user; current contract not independently verified
  exported: ""
  fee_note: "Conditional MUJ APC coverage; verify corresponding author, article type, current term, allocation and ancillary fees."

Elsevier:
  file: Elsevier.xlsx
  kind: institutional eligibility list
  scope: hybrid titles on the sheet named MUJ 2025, with a CiteScore 2024 quartile only; an Elsevier title absent here is not thereby a poor fit
  institution: Manipal University Jaipur (MUJ)
  agreement: MUJ sponsorship as reported by the user; current contract not independently verified
  exported: ""
  fee_note: "Conditional MUJ APC coverage; verify corresponding author, article type, current term, allocation and ancillary fees. The sheet is 2025, and UF's Elsevier agreement is a 15% discount rather than coverage."

ACM:
  file: ACM.xlsx
  kind: publisher title list
  scope: ACM journals, all open access as of 1 January 2026 per the publications overview cited in the workbook Notes sheet
  institution: JK Lakshmipat University (JKLU)
  agreement: JKLU sponsorship as reported by the user; current contract not independently verified
  exported: "2026-01-01"
  fee_note: "Conditional JKLU APC coverage; verify corresponding author, article type, current term, allocation and ancillary fees. Do not infer a subscription route for 2026 ACM journals."

Taylor & Francis:
  file: T_F.xlsx
  kind: publisher open-access title list
  scope: fully open-access titles with 2024 JCR, CiteScore, SNIP and SJR metrics; hybrid T&F titles are not listed
  institution: Manipal University Jaipur (MUJ)
  agreement: MUJ sponsorship as reported by the user; current contract not independently verified
  exported: ""
  fee_note: "Conditional MUJ APC coverage; verify corresponding author, article type, current term, allocation and ancillary fees."
